[project]
name = "automata-mono"
version = "0.1.0"
description = "Roboto Mono with Fira Code ligatures and refined glyphs"
requires-python = ">=3.12"
dependencies = [
    "fonttools>=4.68.0",
    "freetype-py>=2.5.1",
    "pillow>=13.0.0",
    "uharfbuzz>=0.57.0",
]

[tool.uv]
package = false
# Dependency cooldown: only resolve releases that are at least a week old.
exclude-newer = "7 days"
