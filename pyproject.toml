[project]
name = "automata-mono"
version = "0.1.0"
description = "Roboto Mono with Fira Code ligatures and refined glyphs"
requires-python = ">=3.12"
dependencies = [
    "fonttools>=4.68.0",
    "freetype-py>=2.5.1",
    "pillow>=13.0.0",
    "uharfbuzz>=0.57.0",
]

[dependency-groups]
dev = ["ruff>=0.17.6"]

[tool.uv]
package = false
# Dependency cooldown: only resolve releases that are at least a week old.
exclude-newer = "7 days"

[tool.ruff]
# The scripts import each other as top-level modules.
src = ["scripts"]

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]
